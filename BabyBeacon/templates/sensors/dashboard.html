{% block content %}
<div class="min-h-screen bg-gray-50 text-gray-800">

  <nav  class="shadow" style="background:#0f172a; color: white; padding: 10px 20px;">
   
    <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
      <h1 class="text-2xl font-semibold text-align-left">BabyBeacon Dashboard</h1>
      <div class="flex space-x-4">
        <a href="{% url 'dashboard' %}" class="hover:underline">Dashboard</a>
        <a href="{% url 'logout' %}" class="hover:underline">Logout</a>
      </div>
    </div>
   
  </nav>

  <div class="max-w-7xl mx-auto px-4 py-6 space-y-6">

    <div id="alertBox" class="hidden bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative" role="alert">
      <strong class="font-bold">Warning!</strong>
      <span class="block sm:inline" id="alertText">Threshold exceeded.</span>
    </div>

    <div class="grid grid-cols-2 gap-4">
      <div class="bg-white shadow-md rounded-lg p-6 text-center">
        <h2 class="text-gray-500 text-sm uppercase">Temperature</h2>
        <p id="currentTemp" class="text-3xl font-semibold text-blue-600">-- °C</p>
      </div>
      <div class="bg-white shadow-md rounded-lg p-6 text-center">
        <h2 class="text-gray-500 text-sm uppercase">Amplitude</h2>
        <p id="currentAmp" class="text-3xl font-semibold text-green-600">--</p>
      </div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mt-6">
      <div class="bg-white shadow-md rounded-lg p-6">
        <h2 class="text-gray-700 font-semibold mb-3">Temperature History</h2>
        <canvas id="tempChart"></canvas>
      </div>

      <div class="bg-white shadow-md rounded-lg p-6">
        <h2 class="text-gray-700 font-semibold mb-3">Amplitude History</h2>
        <canvas id="ampChart"></canvas>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="https://cdn.tailwindcss.com"></script>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
let tempChart, ampChart;

function initCharts() {
  const tempCtx = document.getElementById('tempChart').getContext('2d');
  const ampCtx = document.getElementById('ampChart').getContext('2d');

  tempChart = new Chart(tempCtx, {
    type: 'line',
    data: { labels: [], datasets: [{ label: 'Temperature (°C)', data: [], borderColor: '#2563eb', backgroundColor: 'rgba(37,99,235,0.1)', fill: true, tension: 0.3 }] },
    options: { responsive: true, animation: false, scales: { y: { beginAtZero: true } } }
  });

  ampChart = new Chart(ampCtx, {
    type: 'line',
    data: { labels: [], datasets: [{ label: 'Amplitude', data: [], borderColor: '#16a34a', backgroundColor: 'rgba(22,163,74,0.1)', fill: true, tension: 0.3 }] },
    options: { responsive: true, animation: false, scales: { y: { beginAtZero: true } } }
  });
}

function appendChartData(labels, tempData, ampData) {
  if (!tempChart || !ampChart) return;

  labels.forEach((label, i) => {
    tempChart.data.labels.push(label);
    tempChart.data.datasets[0].data.push(tempData[i]);

    ampChart.data.labels.push(label);
    ampChart.data.datasets[0].data.push(ampData[i]);
  });

  while (tempChart.data.labels.length > 20) {
    tempChart.data.labels.shift();
    tempChart.data.datasets[0].data.shift();
  }
  while (ampChart.data.labels.length > 20) {
    ampChart.data.labels.shift();
    ampChart.data.datasets[0].data.shift();
  }

  tempChart.update();
  ampChart.update();
}

async function getLatestData() {
  try {
    const response = await fetch('/api/getLatestData/');
    const data = await response.json();

    document.getElementById('currentTemp').textContent = data.temperature_c + ' °C';
    document.getElementById('currentAmp').textContent = data.amplitude;

    const alertBox = document.getElementById('alertBox');
    const alertText = document.getElementById('alertText');
    if (data.temperature_c > data.threshold_temp || data.amplitude > data.threshold_amp) {
      alertBox.classList.remove('hidden');
      alertText.textContent = `Alert: Threshold exceeded! Temp = ${data.temperature_c}°C, Amp = ${data.amplitude}`;
    } else {
      alertBox.classList.add('hidden');
    }

    appendChartData(data.labels, data.temp_history, data.amp_history);
  } catch (err) {
    console.error("Error fetching data:", err);
  }
}

initCharts();

getLatestData();
setInterval(getLatestData, 5000);
</script>
{% endblock %}
